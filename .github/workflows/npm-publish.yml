name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_version="$(tr -d '\r\n' < .deploy/version)"
          if [[ -z "${release_version}" ]]; then
            echo "Cannot read release version from .deploy/version" >&2
            exit 1
          fi
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo ".deploy/version is not a valid semver value: ${release_version}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "${tag_version}" != "${release_version}" ]]; then
              echo "Tag version ${tag_version} does not match .deploy/version ${release_version}" >&2
              exit 1
            fi
          fi

          packages=(
            npm/packages/win32-x64/package.json
            npm/packages/linux-x64/package.json
            npm/packages/darwin-arm64/package.json
            npm/onesearch/package.json
            npm/deqiying-onesearch/package.json
          )

          for package_json in "${packages[@]}"; do
            package_version="$(node -p "require('./${package_json}').version")"
            if [[ "${package_version}" != "${release_version}" ]]; then
              echo "${package_json} version ${package_version} does not match .deploy/version ${release_version}" >&2
              exit 1
            fi
          done

          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Test
        run: go test ./...

  binary-build:
    name: Build release binary ${{ matrix.id }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            goos: linux
            goarch: amd64
            binary_name: onesearch
            archive_ext: tar.gz
          - id: linux-arm64
            goos: linux
            goarch: arm64
            binary_name: onesearch
            archive_ext: tar.gz
          - id: darwin-amd64
            goos: darwin
            goarch: amd64
            binary_name: onesearch
            archive_ext: tar.gz
          - id: darwin-arm64
            goos: darwin
            goarch: arm64
            binary_name: onesearch
            archive_ext: tar.gz
          - id: windows-amd64
            goos: windows
            goarch: amd64
            binary_name: onesearch.exe
            archive_ext: zip
          - id: windows-arm64
            goos: windows
            goarch: arm64
            binary_name: onesearch.exe
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build and archive binary
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ needs.test.outputs.release_version }}"
          archive_name="onesearch_${release_version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          build_dir="dist/build/${archive_name}"
          archive_dir="dist/release"
          mkdir -p "${build_dir}" "${archive_dir}"

          ldflags="-s -w -X github.com/deqiying/onesearch/internal/app.BuildVersion=${release_version}"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags="${ldflags}" -o "${build_dir}/${{ matrix.binary_name }}" ./cmd/onesearch

          cp README.md "${build_dir}/"
          if [[ -f LICENSE ]]; then
            cp LICENSE "${build_dir}/"
          fi
          if [[ "${{ matrix.goos }}" != "windows" ]]; then
            chmod +x "${build_dir}/${{ matrix.binary_name }}"
          fi

          if [[ "${{ matrix.goos }}" == "linux" && "${{ matrix.goarch }}" == "amd64" ]]; then
            "${build_dir}/${{ matrix.binary_name }}" --version
          fi

          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            (cd "${build_dir}" && zip -qr "../../release/${archive_name}.zip" .)
          else
            tar -C "${build_dir}" -czf "${archive_dir}/${archive_name}.tar.gz" .
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.id }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  npm-build:
    name: Build npm binary ${{ matrix.id }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win32-x64
            goos: windows
            goarch: amd64
            binary_name: onesearch.exe
          - id: linux-x64
            goos: linux
            goarch: amd64
            binary_name: onesearch
          - id: darwin-arm64
            goos: darwin
            goarch: arm64
            binary_name: onesearch

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ needs.test.outputs.release_version }}"
          artifact_dir="dist/npm-bin-${{ matrix.id }}"
          mkdir -p "${artifact_dir}"

          ldflags="-s -w -X github.com/deqiying/onesearch/internal/app.BuildVersion=${release_version}"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags="${ldflags}" -o "${artifact_dir}/${{ matrix.binary_name }}" ./cmd/onesearch

      - name: Verify built binary
        if: matrix.goos == 'linux'
        shell: bash
        run: dist/npm-bin-linux-x64/onesearch --version

      - name: Verify agent discovery
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          binary="dist/npm-bin-linux-x64/onesearch"

          schema_json="$("${binary}" schema skills show --format json)"
          if [[ "${schema_json}" != *'"ok":true'* || "${schema_json}" != *'"id":"skills.show"'* ]]; then
            echo "Targeted skills.show schema is missing the expected contract" >&2
            exit 1
          fi

          skills_json="$("${binary}" skills list --format json)"
          if [[ "${skills_json}" != *'"id":"onesearch"'* || "${skills_json}" == *'"onesearch-cli"'* ]]; then
            echo "Bundled skill list does not include onesearch" >&2
            exit 1
          fi

          skill_content="$("${binary}" skills show onesearch --format content)"
          if [[ "${skill_content}" != *'# Onesearch Router'* ]]; then
            echo "Bundled onesearch router content is missing the expected heading" >&2
            exit 1
          fi

          contract_content="$("${binary}" skills show onesearch --file references/agent-execution-contract.md --format content)"
          if [[ "${contract_content}" != *'# Onesearch Agent Execution Contract'* ]]; then
            echo "Bundled agent execution contract content is missing the expected heading" >&2
            exit 1
          fi

      - name: Upload npm binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: npm-bin-${{ matrix.id }}
          path: dist/npm-bin-${{ matrix.id }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  binary-release:
    name: Publish GitHub Release
    needs: binary-build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum * > checksums.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/release/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"

  npm-publish:
    name: Publish npm packages
    needs: npm-build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download Windows binary
        uses: actions/download-artifact@v7
        with:
          name: npm-bin-win32-x64
          path: npm/packages/win32-x64/bin

      - name: Download Linux binary
        uses: actions/download-artifact@v7
        with:
          name: npm-bin-linux-x64
          path: npm/packages/linux-x64/bin

      - name: Download macOS binary
        uses: actions/download-artifact@v7
        with:
          name: npm-bin-darwin-arm64
          path: npm/packages/darwin-arm64/bin

      - name: Verify downloaded binaries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x npm/packages/linux-x64/bin/onesearch npm/packages/darwin-arm64/bin/onesearch
          npm/packages/linux-x64/bin/onesearch --version

      - name: Verify downloaded agent discovery
        shell: bash
        run: |
          set -euo pipefail

          binary="npm/packages/linux-x64/bin/onesearch"

          schema_json="$("${binary}" schema skills show --format json)"
          if [[ "${schema_json}" != *'"ok":true'* || "${schema_json}" != *'"id":"skills.show"'* ]]; then
            echo "Targeted skills.show schema is missing the expected contract" >&2
            exit 1
          fi

          skills_json="$("${binary}" skills list --format json)"
          if [[ "${skills_json}" != *'"id":"onesearch"'* || "${skills_json}" == *'"onesearch-cli"'* ]]; then
            echo "Bundled skill list does not include onesearch" >&2
            exit 1
          fi

          skill_content="$("${binary}" skills show onesearch --format content)"
          if [[ "${skill_content}" != *'# Onesearch Router'* ]]; then
            echo "Bundled onesearch router content is missing the expected heading" >&2
            exit 1
          fi

          contract_content="$("${binary}" skills show onesearch --file references/agent-execution-contract.md --format content)"
          if [[ "${contract_content}" != *'# Onesearch Agent Execution Contract'* ]]; then
            echo "Bundled agent execution contract content is missing the expected heading" >&2
            exit 1
          fi

      - name: Pack dry run
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            ./npm/packages/win32-x64
            ./npm/packages/linux-x64
            ./npm/packages/darwin-arm64
            ./npm/onesearch
            ./npm/deqiying-onesearch
          )

          for package_dir in "${packages[@]}"; do
            npm pack "${package_dir}" --dry-run
          done

      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail

          npm publish ./npm/packages/win32-x64 --access public
          npm publish ./npm/packages/linux-x64 --access public
          npm publish ./npm/packages/darwin-arm64 --access public

      - name: Publish entry packages
        shell: bash
        run: |
          set -euo pipefail

          npm publish ./npm/onesearch
          npm publish ./npm/deqiying-onesearch --access public
